name: "Pull Request Labeler"

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: srvaroa/labeler@e8fbb2561481ef6e711a770f0234e9379dc76892 # master
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
